# Render Blueprint for iCoFyz. Review all resource sizes/pricing in Render before deploying.
services:
  - type: web
    name: icofyz
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: icofyz-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: icofyz-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: icofyz-db
    databaseName: icofyz
    user: icofyz_app
    region: singapore
    postgresMajorVersion: '18'
